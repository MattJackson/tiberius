name: Release

# main always equals the latest crates.io release. A release is a maintainer
# PR dev -> main that bumps the version and CHANGELOG:
#
#   pull_request into main  -> `release gate` only (required check on main)
#   push to main            -> gate, then publish via crates.io Trusted
#                              Publishing, verify the index, tag + GitHub Release
#   workflow_dispatch       -> retry a failed release on main (resumes: crates
#                              already published from this commit are skipped),
#                              or `dry_run` on any ref to exercise the publish
#                              job with `cargo publish --dry-run` and no auth.
#
# Trusted Publishing matches this file name (release.yml) from the OIDC
# `workflow_ref` claim and rejects pull_request_target / workflow_run, so
# publishing must stay in this top-level push-triggered workflow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: `cargo publish --dry-run`, no authentication, no tag"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Releases never cancel each other; PR gate runs get their own group so they
  # cannot displace a pending publish.
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Fork proof only: RELEASE_REGISTRY=staging targets staging.crates.io.
  REGISTRY: ${{ vars.RELEASE_REGISTRY == 'staging' && 'staging' || 'crates-io' }}

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # list qa.yml runs for the tree-identity check
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      plan: ${{ steps.gate.outputs.plan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # All branches and tags: the gate needs dev's history and the tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Fetch dev
        run: git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
      - name: Release gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: python3 .github/scripts/release_gate.py gate --sha "$SHA" --registry "$REGISTRY" --qa-ref origin/dev

  publish:
    name: publish
    needs: gate
    # Real publishes: push to main (or a dispatch retry on main) in the
    # upstream repo, or in a fork that opted into staging.crates.io. Dry runs:
    # any dispatch with dry_run, in any repo.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.ref == 'refs/heads/main' &&
       (github.repository == 'tiberius-rs/tiberius' || vars.RELEASE_REGISTRY == 'staging'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create (creates the tag)
      id-token: write # crates.io Trusted Publishing
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      PUBLISH: ${{ needs.gate.outputs.publish }}
      PLAN: ${{ needs.gate.outputs.plan }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Release plan
        run: |
          echo "$PLAN" | jq .
          echo "registry=$REGISTRY dry_run=$DRY_RUN sha=$SHA"
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        if: env.DRY_RUN != 'true' && env.PUBLISH != ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        with:
          url: ${{ vars.RELEASE_REGISTRY == 'staging' && 'https://staging.crates.io' || 'https://crates.io' }}
      - name: Publish
        if: env.PUBLISH != ''
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          args=()
          for crate in $PUBLISH; do args+=(-p "$crate"); done
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          elif [ "$REGISTRY" = staging ]; then
            export CARGO_REGISTRIES_STAGING_INDEX=sparse+https://index.staging.crates.io/
            export CARGO_REGISTRIES_STAGING_TOKEN="$TOKEN"
            args+=(--registry staging)
          else
            export CARGO_REGISTRY_TOKEN="$TOKEN"
          fi
          # One invocation publishes the crates in dependency order (macros
          # first) and waits for each to be available before the next. A
          # version that already exists is an error, which fails the job.
          cargo publish "${args[@]}"
          for crate in $PUBLISH; do
            version=$(echo "$PLAN" | jq -r --arg c "$crate" '.releases[] | select(.crate == $c) | .version')
            file="target/package/${crate}-${version}.crate"
            echo "${crate} ${version}: $(sha256sum "$file" | cut -d' ' -f1)  $file"
          done
      - name: Verify the registry index
        if: env.DRY_RUN != 'true' && env.PUBLISH != ''
        run: |
          set -euo pipefail
          for crate in $PUBLISH; do
            version=$(echo "$PLAN" | jq -r --arg c "$crate" '.releases[] | select(.crate == $c) | .version')
            python3 .github/scripts/release_gate.py verify --registry "$REGISTRY" \
              --crate "$crate" --version "$version" \
              --crate-file "target/package/${crate}-${version}.crate" --timeout 900
          done
      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "$PLAN" | jq -c '.releases[]' | while read -r rel; do
            crate=$(echo "$rel" | jq -r .crate)
            version=$(echo "$rel" | jq -r .version)
            tag=$(echo "$rel" | jq -r .tag)
            flags=(--target "$SHA" --generate-notes --title "$crate $version")
            if [ "$crate" != tiberius ]; then flags+=(--latest=false); fi
            case "$version" in *-*) flags+=(--prerelease) ;; esac
            if [ "$DRY_RUN" = true ]; then
              echo "dry run: gh release create $tag ${flags[*]}"
            elif gh release view "$tag" >/dev/null 2>&1; then
              echo "release $tag already exists"
            else
              gh release create "$tag" "${flags[@]}"
            fi
          done
